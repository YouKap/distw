  guidelines_topic:
    title: "常見問題解答/指南"
    guidelines_title: "指南"
    body: |
      <a name="civilized"></a>

      ## [這裡是文明的公開討論場所](#civilized)

      請像對待公園一樣對待本論壇。我們也是共享的社群資源，在這裡，可以透過持續對話分享技能、知識和興趣。

      這些不是硬性規定，而是幫助人們對我們社群做出判斷的指導方針，使這裡成為友好、文明的公共言論場所。

      <a name="improve"></a>

      ## [改善討論](#improve)

      不管多小，始終在討論中添加一些積極的內容，幫助我們讓這裡成為出色的討論場所。如果您不確定您的貼文是否能增添對話內容，請想想您要說什麼，然後再試一試。

      改善討論的一種方式是發現已經發生的問題。在回覆或開始自己的主題討論之前，花點時間瀏覽一下這裡的主題，您會有更好的機會遇見興趣相投的人。

      這裡討論的主題對我們很重要，我們希望您能表現出它們對您也很重要。尊重主題和討論這些主題的人，即使您並不贊同他們的觀點。

      <a name="agreeable"></a>

      ## [即使不贊同，也要心平氣和](#agreeable)

      您可能希望給出相反的意見。這很好。但要記住「對事不對人」。請避免：

      * 謾罵
      * 人身攻擊
      * 回應貼文的語氣而不是實際內容
      * 未加思索地反駁

      相反，您應該提供深思熟慮的見解來改善對話。

      <a name="participate"></a>

      ## [您的參與很重要](#participate)

      我們在這裡的對話為每位新訪客定下了基調。選擇參與使這個論壇成為有趣地方的討論，幫助我們影響這個社群的未來 &mdash; 避開那些不會使論壇向好發展的討論。

      Discourse 提供了一些工具，使社群能夠整體識別最佳（和最差）貢獻：書籤數、讚數、檢舉數、回覆數、編輯數、關注數、免打擾數等。請使用這些工具來改善您自己和其他人的體驗。

      讓我們的社群變得越來越美好。

      <a name="flag-problems"></a>

      ## [如果您發現問題，請檢舉](#flag-problems)

      板主擁有特殊權限；他們對這個論壇負責。您也一樣。在您的幫助下，板主可以成為社群推動者，而不僅僅是看門人或監督者。

      當您發現不良行為時，請不要回覆。回覆就表示對不良行為的承認，會助長這些不良行為，消耗您的精力，浪費大家的時間。_只需檢舉即可_。如果累積了足夠多的檢舉，就會自動採取措施，或在板主的干預下採取措施。

      為了維護我們的社群，板主保留在任何時候出於任何原因移除任何內容和任何使用者帳號的權利。板主不會預覽新貼文；板主和網站營運者對社群發布的任何內容不承擔任何責任。

      <a name="be-civil"></a>

      ## [始終保持文明](#be-civil)

      沒有什麼比粗魯更能破壞健康的對話了：

      * 講文明。不要發布任何理性的人會認為冒犯、辱罵或仇恨的內容。
      * 保持乾淨。不要發布任何淫穢或露骨的色情內容。
      * 互相尊重。不要騷擾或指責任何人，冒充別人，或洩露他們的私人資訊。
      * 尊重我們的論壇。不要發布垃圾訊息或以其他方式破壞論壇。

      這些都不是具有精確定義的具体條款，請避免任何此類內容的出現。如果您不確定，問問自己，如果您的貼文出現在主要新聞網站的頭版，您會有什麼感覺。

      這是一個公共論壇，搜尋引擎會對這些討論內容編制索引。請確保您的語言、連結和圖片不會影響家人和朋友的安全。

      <a name="keep-tidy"></a>

      ## [保持整潔](#keep-tidy)

      努力將內容放在合適的位置，以便我們可以將更多的時間花在討論而不是清理上。因此：

      * 不要在錯誤的類別中開始主題；請閱讀類別定義。
      * 不要在多個主題中重複發布相同的內容。
      * 不要發布無內容的回覆。
      * 不要中途改變主題。
      * 不要在您的貼文上簽名 &mdash; 每個貼文都附有您的個人資料。

      不要發布「+1」或「同意」，而要使用「點讚」按鈕。不要從完全不同的方向討論現有主題，而要使用「作為連結主題回覆」。

      <a name="stealing"></a>

      ## [僅發布自己的內容](#stealing)

      未經許可，您不得發布屬於他人的任何數位內容。您不得發布關於竊取他人智慧財產權（軟體、影片、音訊、圖片）或違反任何其他法律的描述、連結或方法。

      <a name="power"></a>

      ## [由您助力](#power)

      本網站由您[友好的板主團隊](%{base_path}/about)和*您*（社群）共同營運。如果您對事情的運作方式有任何其他疑問，請在 %{feedback_category} 中開設新主題，我們一起討論！如果您有無法透過元主題或檢舉解決的嚴重或緊急問題，請[聯繫板主](%{base_path}/about)。
  tos_topic:
    title: "服務條款"
    body: |
      <h2 id="heading--change-me"><a href="#heading--change-me">修改我</a></h2>

      論壇管理員，下面是隱私權政策的範例起始範本，您需要自訂該範本以滿足您的網站需求。

      這些條款並不制約 <%{base_url}> 上的本網際網路論壇的使用，但有一天可能制約。這種情況下，要使用本論壇，您必須同意營運本論壇的公司 %{company_name} 的這些條款。

      本公司可能根據其他條款提供其他產品和服務。這些條款僅適用於本論壇的使用。

      跳到：

      - [重要條款](#heading--important-terms)
      - [您使用本論壇的權限](#heading--permission)
      - [本論壇使用條件](#heading--conditions)
      - [可接受的使用](#heading--acceptable-use)
      - [內容標準](#heading--content-standards)
      - [執法](#heading--enforcement)
      - [您的帳號](#heading--your-account)
      - [您的內容](#heading--your-content)
      - [您的責任](#heading--responsibility)
      - [免責聲明](#heading--disclaimers)
      - [責任限制](#heading--liability)
      - [意見反應](#heading--feedback)
      - [終止](#heading--termination)
      - [爭議](#heading--disputes)
      - [一般條款](#heading--general)
      - [聯繫方式](#heading--contact)
      - [變更](#heading--changes)

      <h2 id="heading--important-terms"><a href="#heading--important-terms">重要條款</a></h2>

      ***這些條款包括許多影響您的權利和責任的重要條款，如[免責聲明](#heading--disclaimers)中的免責聲明、[責任限制](#heading--liability)中本公司對您的責任限制、您同意依據[使用的責任](#heading--responsibility)賠償本公司因您濫用本論壇而造成的損失並同意依據[爭議](#heading--disputes)解決爭議。***

      <h2 id="heading--permission"><a href="#heading--permission">您使用本論壇的權限</a></h2>

      本公司依據這些條款向您授予使用本論壇的權限。每個人都需要同意這些條款才能使用本論壇。

      <h2 id="heading--conditions"><a href="#heading--conditions">本論壇使用條件</a></h2>

      您使用本論壇的權限受以下條件限制：

      1. 您必須年滿十三周歲。

      2. 如果本公司直接聯繫您，表示您無法再使用本論壇，您將無法再使用本論壇。

      3. 您必須按照[可接受的使用](#heading--acceptable-use)和[內容標準](#heading--content-standards)使用本論壇。

      <h2 id="heading--acceptable-use"><a href="#heading--acceptable-use">可接受的使用</a></h2>

      1. 在使用本論壇時不得違反法律。

      2. 未經他人特別許可，不得在本論壇上使用或試圖使用他人的帳號。

      3. 不得在本論壇上購買、銷售或以其他方式交易使用者名稱或其他唯一識別碼。

      4. 不得透過本論壇發送廣告、連鎖信或其他徵求，也不得使用本論壇收集地址或其他個人資料，將其用於商業郵寄清單或資料庫。

      5. 不得自動存取本論壇，或監控本論壇，如透過網路爬蟲、瀏覽器外掛程式或擴充功能，或其他非 Web 瀏覽器的電腦程式。如果您執行公開的搜尋引擎，您可以爬取本論壇來為該搜尋引擎建立索引。

      6. 不得使用本論壇向散佈清單、新聞群組或群組郵件別名發送電子郵件。

      7. 不得虛假地暗示您隸屬於本公司或得到本公司的認可。

      8. 不得在其他網頁上對本論壇上的圖片或其他非超文本內容建立超連結。

      9. 不得從在本論壇上下載的材料中刪除任何顯示專有所有權的標記。

      10. 不得在其他網站上使用 `<iframe>` 顯示本論壇的任何部分。

      11. 不得停用、規避或繞過本論壇的任何安全或存取限制。

      12. 不得透過不合理的請求量，或旨在對本論壇底層的資訊系統施加不合理負載的請求而使本論壇的基礎設施緊張。

      13. 不得透過本論壇冒充他人。

      14. 不得鼓勵或幫助任何人違反這些條款。

      <h2 id="heading--content-standards"><a href="#heading--content-standards">內容標準</a></h2>

      1. 不得向本論壇提交非法、冒犯性或傷害他人的內容。這包括存在騷擾、不當、辱罵或仇恨行為的內容。

      2. 不得向本論壇提交違反法律、侵犯任何人的智慧財產權、侵犯任何人隱私或違反您與他人簽訂的協議的內容。

      3. 不得向本論壇提交包含惡意電腦代碼（如電腦病毒或間諜軟體）的內容。

      4. 不得以佔位符形式向本論壇提交內容來保留特定地址、使用者名稱或其他唯一識別碼。

      5. 不得使用本論壇揭露您無權揭露的資訊，如他人的機密或個人資訊。

      <h2 id="heading--enforcement"><a href="#heading--enforcement">執法</a></h2>

      本公司可以在最大的法律範圍內調查和起訴違反這些條款的行為。本公司可以通知執法部門並與之合作起訴違反法律和這些條款的行為。

      本公司保留出於任何理由變更、編輯和刪除本論壇內容的權利。如果您認為有人在向本論壇提交內容時違反了這些條款，請[立即聯繫我們](#heading--contact)。

      <h2 id="heading--your-account"><a href="#heading--your-account">您的帳號</a></h2>

      您必須建立並登入帳號才能使用本論壇的某些功能。

      要建立帳號，您必須提供有關自己的一些資訊。如果您建立帳號，您同意至少提供有效的電子郵件地址，並使該地址保持最新狀態。您可以隨時透過向 <%{contact_email}> 發送電子郵件關閉您的帳號。

      您同意對使用您的帳號執行的所有操作負責，無論該操作是否經過您的授權，直到您關閉您的帳號或通知本公司您的帳號被盜用。如果您懷疑您的帳號被盜用，您同意立即通知本公司。您同意為您的帳號選擇安全的密碼並對其保密。

      根據其處理著作權相關撤除請求的政策，或者如果本公司合理地認為您違反了這些條款中的任何規則，本公司可能會限制、暫停或關閉您在本論壇上的帳號。

      <h2 id="heading--your-content"><a href="#heading--your-content">您的內容</a></h2>

