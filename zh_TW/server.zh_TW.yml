      subject_template: "[%{email_prefix}] 電子郵件問題 - 被禁止的電子郵件"
      text_body_template: |
        抱歉，但是您向 %{destination}（名為 %{former_title}）發送的電子郵件未成功。

        您的回覆發送自被禁止的電子郵件地址。嘗試從其他電子郵件地址發送，或者[聯繫工作人員](%{base_url}/about)。
    email_reject_not_allowed_email:
      title: "電子郵件被拒：不允許的電子郵件"
      subject_template: "[%{email_prefix}] 電子郵件問題 - 被禁止的電子郵件"
      text_body_template: |
        抱歉，但是您向 %{destination}（名為 %{former_title}）發送的電子郵件未成功。

        您的回覆發送自被禁止的電子郵件地址。嘗試從其他電子郵件地址發送，或者[聯繫工作人員](%{base_url}/about)。
    email_reject_inactive_user:
      title: "電子郵件被拒：停用使用者"
      subject_template: "[%{email_prefix}] 電子郵件問題 - 停用使用者"
      text_body_template: |
        抱歉，但是您向 %{destination}（名為 %{former_title}）發送的電子郵件未成功。

        您與此電子郵件地址關聯的帳號未被啟動，請先啟動您的帳號，然後再發送電子郵件。
    email_reject_silenced_user:
      title: "電子郵件被拒：被禁言的使用者"
      subject_template: "[%{email_prefix}] 電子郵件問題 - 被禁言的使用者"
      text_body_template: |
        抱歉，但是您向 %{destination}（名為 %{former_title}）發送的電子郵件未成功。

        您與此電子郵件地址關聯的帳號已被禁言。
    email_reject_reply_user_not_matching:
      title: "電子郵件被拒 - 使用者不相符"
      subject_template: "[%{email_prefix}] 電子郵件問題 - 意外回覆地址"
      text_body_template: |
        抱歉，但是您向 %{destination}（名為 %{former_title}）發送的電子郵件未成功。

        您的回覆發送自與我們期望的地址不同的電子郵件地址，因此我們無法確定是否為同一個人。嘗試從其他電子郵件地址發送，或者[聯繫工作人員](%{base_url}/about)。
    email_reject_empty:
      title: "電子郵件被拒：空白"
      subject_template: "[%{email_prefix}] 電子郵件問題 - 無內容"
      text_body_template: |
        抱歉，但是您向 %{destination}（名為 %{former_title}）發送的電子郵件未成功。

        我們在您的電子郵件中找不到任何回覆內容。

        如果您收到此郵件，但您「確實」包含了回覆，請使用更簡單的格式重試。
    email_reject_parsing:
      title: "電子郵件被拒：解析"
      subject_template: "[%{email_prefix}] 電子郵件問題 - 內容無法識別"
      text_body_template: |
        抱歉，但是您向 %{destination}（名為 %{former_title}）發送的電子郵件未成功。

        我們在電子郵件中找不到您的回覆。**請確保您的回覆位於電子郵件頂部** - 我們無法處理內嵌回覆。
    email_reject_invalid_access:
      title: "電子郵件被拒：無效存取"
      subject_template: "[%{email_prefix}] 電子郵件問題 - 無效存取"
      text_body_template: |
        抱歉，但是您向 %{destination}（名為 %{former_title}）發送的電子郵件未成功。

        您的帳號沒有權限在該類別下發佈新主題。如果您有異議，請[聯繫工作人員](%{base_url}/about)。
    email_reject_strangers_not_allowed:
      title: "電子郵件被拒：不允許陌生人"
      subject_template: "[%{email_prefix}] 電子郵件問題 - 無效存取"
      text_body_template: |
        抱歉，但是您向 %{destination}（名為 %{former_title}）發送的電子郵件未成功。

        您將此電子郵件發送到的類別僅允許來自使用有效帳號和已知電子郵件地址的使用者的回覆。如果您有異議，請[聯繫工作人員](%{base_url}/about)。
    email_reject_invalid_post:
      title: "電子郵件被拒：無效貼文"
      subject_template: "[%{email_prefix}] 電子郵件問題 - 發文錯誤"
      text_body_template: |
        抱歉，但是您向 %{destination}（名為 %{former_title}）發送的電子郵件未成功。

        可能的原因是：複雜的格式、訊息過長、訊息過短。請重試，如果問題仍然存在，請透過網站發文。
    email_reject_invalid_post_specified:
      title: "電子郵件被拒：指定的貼文無效"
      subject_template: "[%{email_prefix}] 電子郵件問題 - 發文錯誤"
      text_body_template: |
        抱歉，但是您向 %{destination}（名為 %{former_title}）發送的電子郵件未成功。

        原因：

        %{post_error}

        如果您可以解決問題，請重試。
      date_invalid: "找不到貼文建立日期。電子郵件是否缺少 Date: 標頭？"
    email_reject_post_too_short:
      title: "電子郵件被拒：貼文過短"
      subject_template: "[%{email_prefix}] 電子郵件問題 - 貼文過短"
      text_body_template: |
        抱歉，但是您向 %{destination}（名為 %{former_title}）發送的電子郵件未成功。

        為了促進更深入的對話，不允許進行非常簡短的回覆。您能回覆至少 %{count} 個字元嗎？或者，您也可以回覆「+1」，透過電子郵件來點讚貼文。
    email_reject_invalid_post_action:
      title: "電子郵件被拒：無效的貼文操作"
      subject_template: "[%{email_prefix}] 電子郵件問題 - 無效的貼文操作"
      text_body_template: |
        抱歉，但是您向 %{destination}（名為 %{former_title}）發送的電子郵件未成功。

        貼文操作無法被識別。請重試，如果問題仍然存在，請透過網站發文。
    email_reject_reply_key:
      title: "電子郵件被拒：回覆金鑰"
      subject_template: "[%{email_prefix}] 電子郵件問題 - 未知回覆金鑰"
      text_body_template: |
        抱歉，但是您向 %{destination}（名為 %{former_title}）發送的電子郵件未成功。

        電子郵件中的回覆金鑰無效或者未知，因此我們不知道此電子郵件回覆給誰。請[聯繫工作人員](%{base_url}/about)。
    email_reject_bad_destination_address:
      title: "電子郵件被拒：目標地址錯誤"
      subject_template: "[%{email_prefix}] 電子郵件問題 - 未知收件人地址"
      text_body_template: |
        抱歉，但是您向 %{destination}（名為 %{former_title}）發送的電子郵件未成功。

        以下是一些需要檢查的事項：

          - 您是否使用多個電子郵件地址？您回覆的電子郵件地址是否與您最初使用的電子郵件地址不同？電子郵件回覆要求您在回覆時使用相同的電子郵件地址。

          - 您的電子郵件軟體在回覆時是否正確使用了「回覆給」電子郵件地址？不幸的是，一些電子郵件軟體錯誤地將回覆發送到「寄件者」地址，在這種情況下將不成功。

          - 電子郵件中的 Message-ID 標頭是否已被修改？Message-ID 必須一致且不變。

        需要更多幫助？透過 %{base_url}/about 下的「聯繫我們」詳細資訊與我們聯繫
    email_reject_old_destination:
      title: "電子郵件被拒：舊目標"
      subject_template: "[%{email_prefix}] 電子郵件問題 - 您正嘗試回覆舊通知"
      text_body_template: |
        抱歉，但是您向 %{destination}（名為 %{former_title}）發送的電子郵件未成功。

        我們只接受 %{number_of_days} 天內的原始通知回覆。請[訪問主題](%{short_url})繼續對話。
    email_reject_topic_not_found:
      title: "電子郵件被拒 - 找不到主題"
      subject_template: "[%{email_prefix}] 電子郵件問題 - 找不到主題"
      text_body_template: |
        抱歉，但是您向 %{destination}（名為 %{former_title}）發送的電子郵件未成功。

        您正在回覆的主題已不存在 - 也許它已被刪除？如果您有異議，請[聯繫工作人員](%{base_url}/about)。
    email_reject_topic_closed:
      title: "電子郵件被拒 - 主題已被關閉"
      subject_template: "[%{email_prefix}] 電子郵件問題 - 主題已被關閉"
      text_body_template: |
        抱歉，但是您向 %{destination}（名為 %{former_title}）發送的電子郵件未成功。

        您回覆的主題已被關閉，不再接受回覆。如果您有異議，請[聯繫工作人員](%{base_url}/about)。
    email_reject_auto_generated:
      title: "電子郵件被拒 - 自動產生"
      subject_template: "[%{email_prefix}] 電子郵件問題 - 自動產生的回覆"
      text_body_template: |
        抱歉，但是您向 %{destination}（名為 %{former_title}）發送的電子郵件未成功。

        您的電子郵件被標記為「自動產生」，這表示它是由電腦自動建立的，而不是由人輸入的；我們不能接受這種電子郵件。如果您有異議，請[聯繫工作人員](%{base_url}/about)。
    email_reject_unrecognized_error:
      title: "電子郵件被拒 - 無法識別的錯誤"
      subject_template: "[%{email_prefix}] 電子郵件問題 - 無法識別的錯誤"
      text_body_template: |
        抱歉，但是您向 %{destination}（名為 %{former_title}）發送的電子郵件未成功。

        處理您的電子郵件時出現無法識別的錯誤，因此您的郵件未被發佈。您應當重試，或者[聯繫工作人員](%{base_url}/about)。
    email_reject_attachment:
      title: "電子郵件附件被拒"
      subject_template: "[%{email_prefix}] 電子郵件問題 - 附件被拒"
      text_body_template: |
        很抱歉，但是您向 %{destination}（名為 %{former_title}）發送的電子郵件中的一些附件被拒絕。

        詳細資訊：
        %{rejected_errors}

        如果您有異議，請[聯繫工作人員](%{base_url}/about)。
    email_reject_reply_not_allowed:
      title: "電子郵件被拒：不允許回覆"
      subject_template: "[%{email_prefix}] 電子郵件問題 - 不允許回覆"
      text_body_template: |
        抱歉，但是您向 %{destination}（名為 %{former_title}）發送的電子郵件未成功。

        您沒有權限回覆該主題。如果您有異議，請[聯繫工作人員](%{base_url}/about)。
    email_reject_reply_to_digest:
      title: "電子郵件被拒：回覆摘要"
      subject_template: "[%{email_prefix}] 電子郵件問題 - 回覆摘要"
      text_body_template: |
        抱歉，但是您向 %{destination}（名為 %{former_title}）發送的電子郵件未成功。

        我們不接受回覆摘要電子郵件。

        如果您有異議，請[聯繫工作人員](%{base_url}/about)。
    email_reject_too_many_recipients:
      title: "拒絕太多收件人的電子郵件"
      subject_template: "[%{email_prefix}] 電子郵件問題 - 收件人太多"
      text_body_template: |
        抱歉，您向 %{destination}（標題為 %{former_title}）發送的電子郵件未成功。

        您試圖給超過 %{max_recipients_count} 人發送電子郵件，我們的系統自動將您的電子郵件標記為垃圾郵件。

        如果您認為這是一個錯誤，請[聯繫工作人員](%{base_url}/about)。
    email_error_notification:
      title: "電子郵件錯誤通知"
      subject_template: "[%{email_prefix}] 電子郵件問題 - POP 身分驗證錯誤"
      text_body_template: |
        很抱歉，從 POP 伺服器輪詢郵件時出現身分驗證錯誤。

        請確保您在[網站設定](%{base_url}/admin/site_settings/category/email)中正確配置了 POP 憑據。

        如果 POP 電子郵件帳號有 Web UI，您可能需要登入 Web 並在那裡檢查您的設定。
    email_revoked:
      title: "電子郵件地址失效"
      subject_template: "您的電子郵件地址是否正確？"
      text_body_template: |
        抱歉，我們無法透過電子郵件與您聯繫。我們給您發送的最後幾封電子郵件都因無法投遞而被全部退回。

        您能否確保[您的郵件地址](%{base_url}/my/preferences/email)有效？您可能還需要將我們的電子郵件地址新增到您的通訊錄/聯絡人清單中，以提高成功投遞幾率。
    email_bounced: |
      發送至 %{email} 的郵件被退回。

      ### 詳細資訊

      ```text
      %{raw}
      ```
    ignored_users_summary:
      title: "忽略的使用者超過門檻"
      subject_template: "一個使用者被許多其他使用者忽略"
      text_body_template: |
        您好，

        這是一封由 %{site_name} 自動發送的郵件，旨在通知您 %{username} 已被 %{ignores_threshold} 個使用者忽略。這可能表示您的社群已開始出現問題。

        您可能需要審核此使用者以及[被忽略和被設為免打擾的使用者報告](%{base_url}/admin/reports/top_ignored_users)中的其他使用者[最近的貼文](%{base_url}/u/%{username}/summary)。

        有關其他指導，請參閱我們的[社群指南](%{base_url}/guidelines)。
    too_many_spam_flags:
      title: "垃圾訊息檢舉過多"
      preview: "由於垃圾訊息檢舉，貼文已被暫時隱藏。"
      subject_template: "新帳號被暫停"
      text_body_template: |
        您好，

        這是一封由 %{site_name} 自動發送的郵件，旨在通知由於您的貼文被社群檢舉，它們已被暫時隱藏。

        作為預防措施，您的新帳號已被禁言，並且在工作人員審核您的帳號前您無法建立回覆或主題。對於任何不便之處，我們深表歉意。

        有關其他指導，請參閱我們的[社群指南](%{base_url}/guidelines)。
    too_many_tl3_flags:
      title: "TL3 檢舉過多"
      subject_template: "新帳號被暫停"
      text_body_template: |
        您好，

        這是一封由 %{site_name} 自動發送的郵件，旨在通知您由於大量社群檢舉，您的帳號已被暫停。

        作為預防措施，您的新帳號已被禁止建立新回覆或主題，直到工作人員可以審核您的帳號。對於任何不便之處，我們深表歉意。

        有關其他指導，請參閱我們的[社群指南](%{base_url}/guidelines)。
    silenced_by_staff:
      title: "被工作人員禁言"
      preview: "帳號已被臨時暫停。"
      subject_template: "帳號被臨時暫停"
      text_body_template: |
        您好，

        這是一封由 %{site_name} 自動發送的郵件，旨在通知您，作為預防措施您的帳號已被臨時暫停。

        您可以繼續瀏覽，但在[工作人員](%{base_url}/about)審核您最近的貼文前，您將無法回覆或者建立主題。對於任何不便之處，我們深表歉意。

        有關其他指導，請參閱我們的[社群指南](%{base_url}/guidelines)。
    user_automatically_silenced:
      title: "使用者被自動禁言"
      subject_template: "新使用者 %{username} 因社群檢舉被禁言"
      text_body_template: |
        這是一條由系統發送的訊息。

        新使用者 [%{username}](%{user_url}) 已被自動禁言。

        請[審核檢舉內容](%{base_url}/review)。如果 %{username} 被錯誤地禁言，請點擊[此使用者管理頁面](%{user_url})中的解除禁言按鈕。

        此門檻可以透過 `silence_new_user` 網站設定進行變更。
    user_automatically_silenced_with_reason:
      title: "使用者被自動禁言"
      subject_template: "新使用者 %{username} 因社群檢舉被禁言"
      text_body_template: |
        這是一條由系統發送的訊息。

        新使用者 [%{username}](%{user_url}) 已被自動禁言。

        原因 - %{reason}

        請[審核檢舉內容](%{base_url}/review)。如果 %{username} 被錯誤地禁言，請點擊[此使用者管理頁面](%{user_url})中的解除禁言按鈕。

        此門檻可以透過 `silence_new_user` 網站設定進行變更。
    spam_post_blocked:
      title: "垃圾訊息貼文被屏蔽"
      subject_template: "新使用者 %{username} 的貼文因重複連結被屏蔽"
      text_body_template: |
        這是一封自動發送的郵件。

        新使用者 [%{username}](%{user_url}) 嘗試建立多個帶有指向 %{domains} 連結的貼文，但這些貼文被屏蔽以避免垃圾訊息。該使用者仍然可以建立未連結到 %{domains} 的新貼文。

        請[審核使用者](%{user_url})。

        可以透過 `newuser_spam_host_threshold` 和 `allowed_spam_host_domains` 網站設定對此進行修改。如果他們應該被豁免，請考慮將 %{domains} 加入許可清單中。
    unsilenced:
      title: "已被取消禁言"
      preview: "帳號不再處於暫停狀態。"
      subject_template: "帳號不再處於暫停狀態"
      text_body_template: |
        您好，

        這是一封由 %{site_name} 自動發送的郵件，旨在通知您的帳號在工作人員審核後不再處於暫停狀態。

        您現在又可以建立新回覆和主題了。感謝您的耐心等待。
    pending_users_reminder:
      title: "待處理使用者提醒"
      subject_template:
        other: "%{count} 個使用者等待核准"
      text_body_template: |
        有新註冊的使用者正在等待核准（或拒絕），以便他們可以存取此論壇。

        [請審核他們](%{base_url}/admin/users/list/pending)。
    download_remote_images_disabled:
      title: "下載遠端圖片已被停用"
      subject_template: "下載遠端圖片已被停用"
      text_body_template: "由於達到了 `download_remote_images_threshold` 的磁碟空間限制，`download_remote_images_to_local` 設定被停用。"
    new_user_of_the_month:
      title: "您是當月最佳新使用者！"
      subject_template: "您是當月最佳新使用者！"
      text_body_template: |
        恭喜，您獲得了 **%{month_year}** 當月最佳新使用者獎。:trophy:

        此獎項每月僅授予兩名新使用者，並且將在[徽章頁面](%{url})上永久可見。

        您很快就成為我們社群的重要成員。感謝您的加入，繼續努力！
    queued_posts_reminder:
      title: "佇列貼文提醒"
      subject_template:
        other: "%{count} 個貼文等待審核"
      text_body_template: |
        您好，

        新使用者的貼文目前正在等待審核。[在此處核准或拒絕他們](%{base_url}/review?type=ReviewableQueuedPost)。
    user_posts_deleted:
      title: "使用者貼文已被刪除"
      subject_template: "%{user} 的所有貼文已被刪除"
      text_body_template:
        other: "@%{user} 的 %{count} 個貼文已被 @%{staff_user} 刪除。"
