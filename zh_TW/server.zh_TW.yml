  privacy_topic:
    title: "隱私權政策"
    body: |
      ## [論壇管理員，下面是一個您應該為您的網站訂製的隱私權政策的範例起始範本。]

      <a name="collect"></a>

      ## [我們收集哪些資訊？](#collect)

      當您在我們的網站上註冊時，我們會收集您的資訊，當您透過閱讀、撰寫和評價本論壇上分享的內容參與本論壇時，我們會收集您的資料。

      在我們的網站上註冊時，您可能會被要求輸入您的姓名和電子郵件地址。但是，您可以在不註冊的情況下存取我們的網站。您的電子郵件地址將透過包含唯一連結的電子郵件進行驗證。如果存取了該連結，我們便知道您對該電子郵件地址有控制權。

      在註冊和發文時，我們會記錄貼文所來自的 IP 地址。我們還可能保留伺服器日誌，其中包含向我們的伺服器發送的每個請求的 IP 地址。

      <a name="use"></a>

      ## [我們使用您的資訊做什麼？](#use)

      我們向您收集的任何資訊都可能透過下列一種方式使用：

      * 個人化設定您的體驗 &mdash; 您的資訊可以幫助我們更好地滿足您的個人需求。
      * 改進我們的網站 &mdash; 我們根據您提供給我們的資訊和意見反應，不斷努力改進我們的網站。
      * 改進客戶服務 &mdash; 您的資訊可以幫助我們更有效率地回應您的客戶服務請求和支援需求。
      * 定期發送電子郵件 &mdash; 您提供的電子郵件地址可能被用於向您發送資訊、您請求的關於主題變更的通知、回應您的使用者名稱、回覆查詢和/或其他請求或問題。

      <a name="protect"></a>

      ## [我們如何保護您的資訊？](#protect)

      我們採取各種安全措施，確保在您輸入、提交或存取您的個人資訊時您個人資訊的安全。

      <a name="data-retention"></a>

      ## [資料保留政策是什麼？](#data-retention)

      我們會盡最大努力：

      * 將伺服器日誌保留不超過 [天數] 天，該日誌中包含所有發送到此伺服器的請求的 IP 地址。

      <a name="cookies"></a>

      ## [我們使用 Cookie 嗎？](#cookies)

      是的。Cookie 是在您允許的情況下，網站或其服務提供商透過您的 Web 瀏覽器傳輸到您電腦硬碟上的小檔案。這些 Cookie 使網站能夠識別您的瀏覽器，並且如果您有註冊帳號，將其與您的註冊帳號相關聯。

      我們使用 Cookie 來了解和保存您的偏好以便將來存取，並收集關於網站流量和網站互動的彙整資料，以便將來可以提供更好的網站體驗和工具。我們可能與第三方服務提供商簽訂合約，以幫助我們更好地了解我們的網站訪客。這些服務提供商不允許使用代表我們收集的資訊，除非為了幫助我們開展和改進業務。

      <a name="disclose"></a>

      ## [我們是否向外界揭露任何資訊？](#disclose)

      我們不向外界出售、交易或以其他方式轉讓您的個人身分資訊。這不包括協助我們營運網站、經營業務或為您提供服務的可信第三方，前提是這些第三方同意對這些資訊保密。當我們認為為了遵守法律、執行我們的網站政策或保護我們或他人的權利、財產或安全而適合發佈時，我們也可能發佈您的資訊。但是，無法識別個人身分的訪客資訊可能被提供給其他方，用於行銷、廣告或其他用途。

      <a name="third-party"></a>

      ## [第三方連結](#third-party)

      有時，我們可能自行決定在我們的網站上包含或提供第三方產品或服務。這些第三方網站具有單獨和獨立的隱私權政策。因此，我們對這些連結網站的內容和活動不承擔責任和義務。儘管如此，我們仍努力保護我們網站的完整性並歡迎對這些網站提供任何意見反應。

      <a name="coppa"></a>

      ## [美國《兒童線上隱私權保護法》合規性](#coppa)

      我們的網站、產品和服務全部面向 13 歲或以上人群。如果此伺服器在美國，而且您未滿 13 歲，根據 COPPA（[兒童線上隱私權保護法](https://en.wikipedia.org/wiki/Children%27s_Online_Privacy_Protection_Act)），請勿使用本網站。

      <a name="online"></a>

      ## [僅線上隱私權政策](#online)

      本線上隱私權政策僅適用於透過我們的網站收集的資訊，不適用於離線收集的資訊。

      <a name="consent"></a>

      ## [您的內容](#consent)

      使用本網站，即表示您同意我們網站的隱私權政策。

      <a name="changes"></a>

      ## [我們隱私權政策的變更](#changes)

      如果我們決定變更我們的隱私權政策，我們將在此頁面上發佈這些變更。

