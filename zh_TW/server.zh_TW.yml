      description: 主題獲得 10 個讚
      long_description: |
        當您的主題獲得 10 個讚時，將授予此徽章。您開始了一個社群喜歡的有趣對話。
    good_topic:
      name: 很好的主題
      description: 主題獲得 25 個讚
      long_description: |
        當您的主題獲得 25 個讚時，將授予此徽章。您發起了一場充滿活力的對話，將社群團結起來。
    great_topic:
      name: 精彩的主題
      description: 主題獲得 50 個讚
      long_description: |
        當您的主題獲得 50 個讚時，將授予此徽章。您開啟了一場引人入勝的對話，社群喜歡由此產生的熱烈討論！
    nice_share:
      name: 不錯的分享
      description: 與 25 個唯一身分訪客分享貼文
      long_description: |
        當您分享的連結被 25 個唯一身分外部訪客點擊時，將授予此徽章。感謝您宣傳我們的討論和社群。
    good_share:
      name: 很棒的分享
      description: 與 300 個唯一身分訪客分享貼文
      long_description: |
        當您分享的連結被 300 個唯一身分外部訪客點擊時，將授予此徽章。幹得漂亮！您向一群新人展示了一場精彩的討論，並幫助這個社群成長。
    great_share:
      name: 精彩的分享
      description: 與 1000 個唯一身分訪客分享貼文
      long_description: |
        當您分享的連結被 1000 個唯一身分外部訪客點擊時，將授予此徽章。哇！您將一個有趣的討論介紹給大量新受眾，並幫助社群前進了一大步！
    first_like:
      name: 第一個讚
      description: 讚了一個貼文
      long_description: |
        當您首次使用 :heart: 按鈕讚一個貼文時，將授予此徽章。點讚貼文是讓社群成員知道他們所發布的內容有趣、實用、炫酷的絕佳方法。分享愛！
    first_flag:
      name: 首次檢舉
      description: 檢舉了一個貼文
      long_description: |
        當您首次檢舉貼文時，將授予此徽章。檢舉是我們所有人幫助保持這裡成為適合每個人的好地方的方式。如果您發現任何貼文因任何原因需要板主注意，請儘管檢舉。如果您看到一個問題，:flag_black: 檢舉它！
    promoter:
      name: 推廣者
      description: 邀請了一個使用者
      long_description: |
        當您透過您的使用者頁面上或主題底部的邀請按鈕邀請某人加入社群時，將授予此徽章。邀請可能對特定討論感興趣的朋友是向我們社群介紹新人的絕佳方法，謝謝！
    campaigner:
      name: 活動家
      description: 邀請了 3 個基本使用者
      long_description: |
        當您邀請 3 位隨後在網站上花費足夠時間成為基本使用者的人時，將授予此徽章。一個充滿活力的社群需要定期注入新人，他們定期參與並在對話中添加新的聲音。
    champion:
      name: 擁護者
      description: 邀請了 5 個成員
      long_description: |
        當您邀請 5 位隨後在網站上花費足夠時間成為正式會員的人時，將授予此徽章。哇！感謝您透過新成員擴大我們社群的多元化！
    first_share:
      name: 首次分享
      description: 分享了一個貼文
      long_description: |
        當您第一次使用分享按鈕分享回覆或主題的連結時，將授予此徽章。分享連結是向世界其他地方展示有趣討論並發展您的社群的絕佳方法。
    first_link:
      name: 首次連結
      description: 新增了指向另一個主題的連結
      long_description: |
        當您第一次新增指向其他主題的連結時，將授予此徽章。透過在兩個方向上顯示主題之間的聯繫，連結主題可以幫助其他讀者找到有趣的回應討論。多連結一些主題吧！
    first_quote:
      name: 首次引用
      description: 引用了一篇貼文
      long_description: |
        當您首次在回覆中引用貼文時，將授予此徽章。在您的回覆中引用之前貼文的相關部分有助於將討論聯繫在一起並圍繞主題進行。最簡單的引用方法是高亮顯示貼文的某個部分，然後按任意回覆按鈕。慷慨地引用吧！
    read_guidelines:
      name: 閱讀指南
      description: 閱讀 <a href="%{base_uri}/guidelines">社群指南</a>
      long_description: |
        當您<a href="%{base_uri}/guidelines">閱讀社群指南</a>後，將授予此徽章。遵守和分享簡單的指南可以幫助我們打造一個穩定、有趣和永續的社群。永遠記住其他人，一個和您有很多共通點的人，就在螢幕的那一側。友善一些！
    reader:
      name: 讀者
      description: 閱讀超過 100 個回覆的主題中的每個回覆
      long_description: |
        當您第一次閱讀超過 100 個回覆的長主題時，將授予此徽章。仔細閱讀對話可以幫助您追蹤討論，理解不同的觀點，並推動更有趣的對話。您讀得越多，對話就越好。正如我們常說的，閱讀是基礎！:slight_smile:
    popular_link:
      name: 熱門連結
      description: 分享的連結被點擊了 50 次
      long_description: |
        當您分享的連結獲得 50 次點擊時，將授予此徽章。感謝您發布一個有用的連結，為對話添加了有趣的背景資訊！
    hot_link:
      name: 火熱連結
      description: 分享的連結被點擊了 300 次
      long_description: |
        當您分享的連結獲得 300 次點擊時，將授予此徽章。感謝您發布一個引人入勝的連結，推動對話向前發展並點亮了討論！
    famous_link:
      name: 著名連結
      description: 分享的連結被點擊了 1000 次
      long_description: |
        當您分享的連結獲得 1000 次點擊時，將授予此徽章。哇！您發布了一個連結，它透過添加基本細節、背景和資訊顯著改善了對話。做得好！
    appreciated:
      name: 受到讚賞
      description: 有 20 篇貼文都被讚了 1 次
      long_description: |
        當您在 20 篇不同的貼文上至少獲得一個讚時，將授予此徽章。社群正在享受您對這裡對話的貢獻！
    respected:
      name: 受人尊敬
      description: 有 100 篇貼文都被讚了 2 次
      long_description: |
        當您在 100 篇不同的貼文上至少獲得 2 個讚時，將授予此徽章。社群越來越尊重您對這裡許多對話的貢獻。
    admired:
      name: 受人敬仰
      description: 有 300 篇貼文都被讚了 5 次
      long_description: |
        當您在 300 篇不同的貼文上至少獲得 5 個讚時，將授予此徽章。哇！社群欽佩您對這裡對話頻繁、高品質的貢獻。
    out_of_love:
      name: 出於愛
      description: 一天內上限送出 %{max_likes_per_day} 個讚
      long_description: |
        當您一天內上限送出 %{max_likes_per_day} 個讚時，將授予此徽章。記得撥冗點讚您喜歡和欣賞的貼文，這會鼓勵您的社群成員在未來創造更多精彩討論。
    higher_love:
      name: 更多的愛
      description: 一天內上限送出 %{max_likes_per_day} 個讚，並達到 5 次
      long_description: |
        當您在一天內上限送出 %{max_likes_per_day} 個讚並達到 5 次時，將授予此徽章。感謝您撥冗每天積極鼓勵進行最佳對話！
    crazy_in_love:
      name: 狂熱
      description: 一天內上限送出 %{max_likes_per_day} 個讚，並達到 20 次
      long_description: |
        當您在一天內上限送出 %{max_likes_per_day} 個讚並達到 20 次時，將授予此徽章。哇！您是鼓勵社群成員的榜樣！
    thank_you:
      name: 謝謝
      description: 有 20 篇被讚的貼文，並送出了 10 個讚
      long_description: |
        當您擁有 20 篇被讚的貼文並送出 10 個或更多讚作為回報時，將授予此徽章。當有人讚您的貼文時，您也應當撥冗去讚其他人的貼文。
    gives_back:
      name: 回饋
      description: 有 100 篇被讚的貼文，並送出了 100 個讚
      long_description: |
        當您擁有 100 篇被讚的貼文並送出 100 個或更多讚作為回報時，將授予此徽章。感謝您分享感激之情！
    empathetic:
      name: 善解人意
      description: 有 500 篇被讚的貼文，並送出了 1000 個讚
      long_description: |
        當您擁有 500 篇被讚的貼文並送出 1000 個或更多讚作為回報時，將授予此徽章。哇！您是一個慷慨且會換位思考的模範。:two_hearts:
    first_emoji:
      name: 第一個表情符號
      description: 在貼文中使用表情符號
      long_description: |
        當您首次在貼文中添加表情符號 :thumbsup: 時，將授予此徽章。表情符號讓您可以在貼文中傳達情感，從快樂 :smiley: 到悲傷 :anguished:，再到憤怒 :angry:，以及 :sunglasses: 之間的一切。只需輸入 :（冒號）或按編輯器中的表情符號工具列按鈕，即可從數百個選項中進行選擇 :ok_hand:
    first_mention:
      name: 首次標記
      description: 在貼文中標記了使用者
      long_description: |
        當您第一次在貼文中標記 (@) 某人的使用者名稱時，將授予此徽章。每次標記都會向此人發送通知，以便他們了解您的貼文。只需輸入 @ 即可標記任何使用者或群組（如果允許）- 這是一種引起他們注意的便捷方式。
    first_onebox:
      name: 首個 Onebox
      description: 發布了一個 Onebox 連結
      long_description: |
        當您第一次在一行上單獨發布連結時，將授予此徽章。該連結會自動擴展為帶有摘要、標題和圖片（如果可用）的 Onebox。
    first_reply_by_email:
      name: 第一次透過電子郵件回覆
      description: 透過電子郵件回覆貼文
      long_description: |
        當您第一次透過電子郵件 :e-mail: 回覆貼文時，將授予此徽章。
    new_user_of_the_month:
      name: 當月最佳新使用者
      description: 在註冊的第一個月做出傑出貢獻
      long_description: |
        此徽章每個月被授予做出傑出貢獻的兩名新使用者。整體貢獻根據他們的貼文被讚的頻率和被誰讚進行衡量。
    enthusiast:
      name: 愛好者
      description: 連續 10 天造訪
      long_description: |
        連續 10 天造訪論壇會被授予此徽章。感謝與我們共度超過一週的時光！
    aficionado:
      name: 百尺竿頭
      description: 連續 100 天造訪
      long_description: |
        連續 100 天造訪論壇會被授予此徽章。這可是超過三個月的時間！
    devotee:
      name: 全年不落
      description: 連續 365 天造訪
      long_description: |
        連續 365 天造訪論壇會被授予此徽章。哇喔，一整年！
