      本公司可能會根據這些條款，使用您在本論壇上為您的帳號提供的電子郵件地址，或透過在本論壇首頁或您的帳號頁面上發佈訊息來通知您。

      <h2 id="heading--changes"><a href="#heading--changes">變更</a></h2>

      本公司上次更新這些條款的日期為 [在此處插入上次更新日期]，並可能再次更新這些條款。本公司將在本論壇上發佈所有更新。對於包含重大變更的更新，如果您建立了帳號並提供了有效的電子郵件地址，本公司同意向您發送電子郵件。本公司還可能在本論壇上透過特殊訊息或提醒來宣布更新。

