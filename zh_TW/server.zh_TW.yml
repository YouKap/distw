    usage_tips:
      text_body_template: |
        有關作為新使用者入門的一些快速提示，請[查看此部落格文章](https://blog.discourse.org/2016/12/discourse-new-user-tips-and-tricks/)。

        當您在這裡參與時，我們會了解您，並且臨時的新使用者限制將被取消。隨著時間的推移，您將獲得[信任層級](https://blog.discourse.org/2018/06/understanding-discourse-trust-levels/)，其中包括幫助我們共同管理社群的特殊權限。
    welcome_user:
      title: "歡迎使用者"
      preview: "歡迎來到 %{site_name}！"
      subject_template: "歡迎來到 %{site_name}！"
      text_body_template: |
        感謝您加入 %{site_name}，歡迎！

        %{new_user_tips}

        我們始終相信[文明社群行為](%{base_url}/guidelines)。

        請享受您在社群的時光吧！
    welcome_tl1_user:
      title: "歡迎 TL1 使用者"
      subject_template: "感謝與我們共度時光"
      text_body_template: |
        嘿！我們看到您一直忙著閱讀，這太棒了，所以我們提升了您的[信任層級](https://blog.discourse.org/2018/06/understanding-discourse-trust-levels/)！

        我們很高興您和我們共度時光，我們很想詳細地了解您。花一點時間[填寫您的個人資料](%{base_url}/my/preferences/profile)，或者隨時[開始一個新主題](%{base_url}/categories)。
    welcome_staff:
      title: "歡迎工作人員"
      subject_template: "恭喜，您已獲得 %{role} 身分！"
      text_body_template: |
        一名工作人員已授予您 %{role} 身分。

        作為一名 %{role}，現在您可以存取 <a href='%{base_url}/admin' target='_blank'>管理介面</a>。

        擁有權利的同時也需要承擔重大責任。如果您不熟悉審核，請參閱[審核指南](https://meta.discourse.org/t/discourse-moderation-guide/63116)。
    welcome_invite:
      title: "歡迎邀請"
      preview: "歡迎來到 %{site_name}！"
      subject_template: "歡迎來到 %{site_name}！"
      text_body_template: |
        感謝您接受邀請加入 %{site_name} - 歡迎！

        - 我們為您建立了帳號 **%{username}**。存取[您的使用者個人資料][prefs]以修改姓名或密碼。

        - 請**使用原始邀請中的電子郵件地址**登入，否則我們無法分辨是不是您本人！

        - %{new_user_tips}

        我們始終相信[文明社群行為](%{base_url}/guidelines)。

        請享受您在社群的時光吧！

        [prefs]：%{user_preferences_url}
    tl2_promotion_message:
      subject_template: "恭喜您的信任層級提升！"
      text_body_template: |
        我們已將您提升到另一個[信任層級](https://blog.discourse.org/2018/06/understanding-discourse-trust-levels/)！

        達到信任層級 2 意味著您已閱讀並積極參與，足以被視為此社群的成員。

        作為有經驗的使用者，您可能需要[這份方便的提示和技巧清單](https://blog.discourse.org/2016/12/discourse-new-user-tips-and-tricks/)。

        我們邀請您繼續參與 - 我們很高興有您在身邊。
