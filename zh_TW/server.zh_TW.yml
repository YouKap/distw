      在您與本公司之間，您仍然對您提交到本論壇的內容全權負責。您同意不會錯誤地暗示您提交到本論壇的內容是由本公司倡議或獲得本公司批准的。這些條款並不要求本公司根據這些條款儲存、維護或提供您提交的內容的複本，也不要求本公司對其進行變更。

      您提交到本論壇的內容屬於您，您可以決定為別人賦予何種權限。但您至少應允許本公司向本論壇其他使用者提供您提交到本論壇的內容。該特殊許可允許公司複製、發佈和分析您提交到本論壇的內容。

      當您提交的內容從本論壇中刪除時，無論是由您還是由本公司刪除，當最後一份複本從公司的備份、快取和其他系統中消失時，本公司的特殊許可即告終止。您對提交的內容申請的其他許可，如[創用 CC](https://creativecommons.org) 授權，可以在您的內容刪除後繼續。這些許可可以授予他人或本公司再次透過本論壇分享您的內容的權利。

      接收您提交到本論壇的內容的其他人可能會違反您的內容授權條款。您同意本公司不為這些違規行為或其後果對您負責。

      <h2 id="heading--responsibility"><a href="#heading--responsibility">您的責任</a></h2>

      您同意賠償本公司因您違反這些條款，或因其他人使用您在本論壇上的帳號違反這些條款而被他人提起的法律索賠。您和本公司都同意儘快就您可能需要賠償本公司的任何法律索賠通知對方。如果本公司未能及時通知您某項法律索賠，您不必就您本可以透過及時通知進行辯護或減輕的損失對本公司進行賠償。您同意允許本公司控制對您必須賠償本公司的法律索賠進行的調查、辯護和解決，並配合這些努力。本公司同意，未經您事先同意，不會同意任何替您認錯或給您強加義務的和解。

      <h2 id="heading--disclaimers"><a href="#heading--disclaimers">免責聲明</a></h2>

      ***您接受使用本論壇和本論壇內容的所有風險。在法律允許的範圍內，本公司及其供應商按現狀提供本論壇，不提供任何保證。***

      本論壇可以超連結到和整合其他人營運的論壇和服務。本公司不對他人營運的服務或可能提供的內容做出任何保證。使用他人營運的服務可能受您與營運該服務的一方之間的其他條款制約。

      <h2 id="heading--liability"><a href="#heading--liability">責任限制</a></h2>

      ***當您同意這些條款時，本公司及其供應商均不為其人員無法合理預見的違約損害對您承擔責任。***

      ***在法律允許的範圍內，對於與本論壇或本論壇內容有關的任何類型的索賠，對您的全部責任將限制在 50 美元。***

      <h2 id="heading--feedback"><a href="#heading--feedback">意見反應</a></h2>

      本公司歡迎您對本論壇提供意見反應和建議。請參閱以下[聯繫](#heading--contact)部分，了解與我們聯繫的方式。

      您同意本公司可以自由地根據您提供的意見反應和建議採取行動，並且本公司不必通知您相關意見反應已被使用，也不必獲得您的使用許可或向您付款。您同意不向您或他人提交您認為可能為機密或專有的意見反應或建議。

      <h2 id="heading--termination"><a href="#heading--termination">終止</a></h2>

      您或公司可以隨時終止這些條款中所述的協議。當我們的協議終止時，您使用本論壇的權限即告終止。

      以下條款在我們的協議終止後仍然有效：[您的內容](#heading--your-content)、[意見反應](#heading--feedback)、[您的責任](#heading--responsibility)、[免責聲明](#heading--disclaimers)、[責任限制](#heading--liability)和[一般條款](#heading--general)。

      <h2 id="heading--disputes"><a href="#heading--disputes">爭議</a></h2>

      %{governing_law} 將管控與這些條款或您對本論壇的使用有關的任何爭議。

      您和公司同意僅在 %{city_for_disputes} 的州或聯邦法院尋求與這些條款相關的禁令。您和本公司均不反對這些法院的管轄權、訴訟地或審判地。

      ***您和本公司將透過具有約束力的美國仲裁協會仲裁解決任何爭議，而不是根據《電腦詐欺與濫用法案》尋求禁令或索賠。仲裁將遵循美國仲裁協會的 Commercial Arbitration Rules（商業仲裁規則）和 Supplementary Procedures for Consumer Related Disputes（消費者相關爭議補充程序）。仲裁將在 %{city_for_disputes} 進行。無論您是作為原告還是集體成員，您都將以個人身分解決任何爭議，而不是作為集體訴訟或其他代表人訴訟的一部分。未經本公司許可，任何仲裁員不得將任何爭議與任何其他仲裁合併。***

      任何仲裁裁決都將包括仲裁費用、合理的律師費和證人的合理費用。您和本公司可以在任何有管轄權的法院進行仲裁裁決。

      <h2 id="heading--general"><a href="#heading--general">一般條款</a></h2>

      如果這些條款中的某項規定無法按書面規定執行，但可以透過修改使其可以執行，則應在必要的最低範圍內修改該規定，使其可以執行。否則，應刪除該規定。

      您不得轉讓您與本公司簽訂的協議。本公司可以將您的協議轉讓給本公司的任何附屬公司、獲得本公司控制權的任何其他公司或購買與本論壇相關的公司資產的任何其他公司。任何試圖違反這些條款進行的轉讓均不具有法律效力。

      行使本協議項下的任何權利和對任何違反本協議的行為不予追究均不表示對違反本協議的任何其他行為不予追究。

      這些條款包含了您與公司之間就您對本論壇使用達成的所有協議條款。這些條款完全取代關於您的本論壇使用的任何其他協議，無論是否為書面協議。

      <h2 id="heading--contact"><a href="#heading--contact">聯繫方式</a></h2>

